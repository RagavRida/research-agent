services:
  - type: web
    name: research-agent-api
    runtime: docker
    dockerfilePath: ./research_agent/Dockerfile
    dockerContext: ./research_agent
    plan: free
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: PORT
        value: 8000
