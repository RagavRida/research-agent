databases:
  - name: aria-db
    plan: free
    databaseName: aria
    user: aria

services:
  - type: web
    name: research-agent-api
    runtime: docker
    dockerfilePath: ./research_agent/Dockerfile
    dockerContext: ./research_agent
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRES_MINUTES
        value: "10080"
      - key: DATABASE_URL
        fromDatabase:
          name: aria-db
          property: connectionString
      - key: PORT
        value: 8000
