  <!-- JSON-LD: FAQPage Schema (GEO Optimization — +40% AI citation visibility) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "What is ARIA Research Agent?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "ARIA (Autonomous Research Intelligence Agent) is an AI-powered research tool built on LangGraph that uses a hybrid ReAct + Plan-and-Execute pattern. It autonomously decomposes your research query into subtasks, searches across web, scholarly, and news sources using the Tavily API, evaluates results with a confidence score from 0-100, and retries with reformulated strategies when confidence is below 85%."
        }
      },
      {
        "@type": "Question",
        "name": "How does ARIA's self-correction work?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "ARIA's self-correction mechanism uses a closed feedback loop: when the Evaluator node scores confidence below 85%, it produces a specific reformulation hint identifying exactly what information is missing. The Search node then uses this hint to reformulate its query — targeting specific gaps, switching tools from web to scholar if needed, and avoiding previously used queries. This loop repeats for up to 8 iterations before force-synthesizing the best available result."
        }
      },
      {
        "@type": "Question",
        "name": "What search tools does ARIA use?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "ARIA uses three Tavily API-powered search tools: web_search (advanced depth, 8 results) for general coverage, scholar_search (filtered to arXiv, PubMed, JSTOR, Semantic Scholar) for academic sources, and news_search (last 90 days, 6 results) for recent developments. The agent dynamically selects the best tool per iteration based on LLM reasoning."
        }
      },
      {
        "@type": "Question",
        "name": "What LLM models power ARIA?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "ARIA uses two tiers of LLMs. For fast operations (planning, search decisions, evaluation), it uses Groq's llama-3.1-8b-instant or Google's Gemini 2.0-flash. For final synthesis requiring long-context processing, it uses Groq's llama-3.3-70b-versatile or Google's Gemini 1.5-pro. Users can switch between Groq and Gemini providers via the UI."
        }
      },
      {
        "@type": "Question",
        "name": "How is ARIA's confidence score calculated?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "ARIA's confidence score is a weighted composite from 0-100 calculated by the Evaluator node: Coverage of the core question (40 points max), Source reliability — academic > official > news > blog (30 points max), Recency of data (15 points max), and Consistency across sources (15 points max). A score of 85 or above triggers synthesis; below 85 triggers a retry with a reformulated search strategy."
        }
      }
    ]
  }
  </script>
