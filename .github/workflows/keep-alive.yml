name: keep-alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /api/health via Vercel proxy
        run: |
          set -euo pipefail
          URL="https://aria-landing-one.vercel.app/api/health"
          BODY=$(curl -fsS --max-time 30 --retry 3 --retry-delay 5 "$URL")
          echo "$BODY"
          echo "$BODY" | grep -q '"status":"healthy"'
