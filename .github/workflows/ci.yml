name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research_agent
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research_agent/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          TAVILY_API_KEY: test-tavily
          JWT_SECRET: ci-secret
          LLM_PROVIDER: gemini
          GOOGLE_API_KEY: test-google
        run: pytest -q

  landing:
    name: Landing — typecheck + build
    runs-on: ubuntu-latest
    steps:
      - name: Skip (handled in RagavRida/aria-landing)
        run: echo "Landing lives in its own repo — CI runs there."
